<template name="gaQuestionsn">
    <style>
        .page-header {
            text-align: center;
            margin: 30px 0 40px 0;
            color: #333;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .input-field {
            margin-bottom: 30px;
        }
        
        .input-field input {
            font-size: 18px !important;
            height: 50px !important;
            padding: 15px !important;
            border: 2px solid #ddd !important;
            border-radius: 5px !important;
            cursor: pointer; /* Show it's clickable/interactive */
        }
        
        .input-field input:readonly {
            background-color: #f8f9fa; /* Slightly different background to indicate read-only */
        }
        
        .input-field label {
            font-size: 16px !important;
            font-weight: 500;
            position: relative; /* or absolute */
            top: -90px; /* Negative values move up, positive values move down */
        }
        
        .viz-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .viz-link:hover {
            background-color: #1976D2;
            color: white;
        }

        .variable-lists {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .variable-list {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            min-width: 200px;
            flex: 1;
        }

        .variable-list h4 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            font-size: 16px;
            font-weight: 600;
        }

        .variable-list ul {
            margin: 0;
            padding-left: 20px;
            list-style-type: disc;
        }

        .variable-list li {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
            cursor: pointer;
            transition: color 0.2s;
        }

        .variable-list li:hover {
            color: #2196F3;
            text-decoration: underline;
        }

        .demo-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .demo-header {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            margin-bottom: 20px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            .variable-lists {
                flex-direction: column;
            }
            
            .page-header {
                font-size: 36px;
            }
        }
    </style>
    
    <main id="ga-main">
        <div class="wrapper">
            <!-- Big Header -->
            <h1 class="page-header">Question Generation Page</h1>
            
            <div class="intro-section" style="margin-top:20px;">
                <div class="row">
                    <div class="col m3 s12">
                        <img class="responsive-img" src="/images/galileo/galileo-flask.png" style="width:90%;" />
                    </div>
                    <!-- <div class="col m3 s12">
                        <div class="demo-section">
                            <h3 class="demo-header">System Demo</h3>
                            <div class="video-container">
                                <iframe 
                                    src="https://www.youtube.com/embed/Pq47WUV0jU0" 
                                    title="Gut Instinct Demo Video" 
                                    frameborder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowfullscreen>
                                </iframe>
                            </div>
                        </div>
                    </div> -->
                    <div class="col s12">
                        <!-- Variable Lists -->
                        <div class="variable-lists">
                            <div class="variable-list">
                                <h4>Demographic Variables</h4>
                                <ul>
                                    <li onclick="setVariable1(this)">SampleID</li>
                                    <li onclick="setVariable1(this)">PID</li>
                                    <li onclick="setVariable1(this)">Time_Point</li>
                                    <li onclick="setVariable1(this)">Study</li>
                                    <li onclick="setVariable1(this)">Ext_Date</li>
                                    <li onclick="setVariable1(this)">Extraction_Location</li>
                                    <li onclick="setVariable1(this)">Ext_By</li>
                                    <li onclick="setVariable1(this)">Plate</li>
                                    <li onclick="setVariable1(this)">Well</li>
                                </ul>
                            </div>
                            
                            <div class="variable-list">
                                <h4>Other Variables</h4>
                                <ul>
                                    <li onclick="setVariable2(this)">BarcodeSequence</li>
                                    <li onclick="setVariable2(this)">LinkerPrimerSequence</li>
                                    <li onclick="setVariable2(this)">SEQ</li>
                                    <li onclick="setVariable2(this)">DNA_Conc</li>
                                    <li onclick="setVariable2(this)">Amp_Conc</li>
                                </ul>
                            </div>
                        </div>

                        <!-- Input fields for two variables -->
                        <div class="input-field">
                            <input id="variable1" type="text" placeholder="Click an item above to select" readonly>
                            <label for="variable1"> Enter iMSMS variable </label>
                        </div>
                        
                        <div class="input-field">
                            <input id="variable2" type="text" placeholder="Click an item above to select" readonly>
                            <label for="variable2"> Enter Algorithm</label>
                        </div>
                        
                        <a href="#" id="seeViz" class="viz-link">Click to see the plot for this question: "How does ___ affect microbial diversity in the moving pictures dataset, as shown by the ____ algorithm?"</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        function updateVizLink() {
            const variable1 = document.getElementById('variable1').value.trim();
            const variable2 = document.getElementById('variable2').value.trim();
            const vizLink = document.getElementById('seeViz');
            
            // Only use defaults if both fields are completely empty
            const var1Text = variable1 || '___';
            const var2Text = variable2 || '___';
            
            vizLink.textContent = `Click to see the plot for this question: "How does ${var1Text} affect microbial diversity in the moving pictures dataset, as shown by the ${var2Text} algorithm?"`;
        }
        
        function setVariable1(element) {
            document.getElementById('variable1').value = element.textContent;
            updateVizLink();
        }
        
        function setVariable2(element) {
            document.getElementById('variable2').value = element.textContent;
            updateVizLink();
        }
        
        // Update the link text when inputs change
        document.getElementById('variable1').addEventListener('input', updateVizLink);
        document.getElementById('variable2').addEventListener('input', updateVizLink);
        
        // Initialize when page loads, but wait a moment for browser to restore form values
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(updateVizLink, 100);
        });
    </script>
</template>
