<template name="gaQuestions">
    <style>
        .page-header {
            text-align: center;
            margin: 30px 0 40px 0;
            color: #333;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .input-field {
            margin-bottom: 30px;
        }
        
        .input-field input {
            font-size: 18px !important;
            height: 50px !important;
            padding: 15px !important;
            border: 2px solid #ddd !important;
            border-radius: 5px !important;
            cursor: pointer; /* Show it's clickable/interactive */
        }
        
        .input-field input:readonly {
            background-color: #f8f9fa; /* Slightly different background to indicate read-only */
        }
        
        .input-field label {
            font-size: 16px !important;
            font-weight: 500;
        }
        
        .viz-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .viz-link:hover {
            background-color: #1976D2;
            color: white;
        }

        .variable-lists {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .variable-list {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            min-width: 200px;
            flex: 1;
        }

        .variable-list h4 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            font-size: 16px;
            font-weight: 600;
        }

        .variable-list ul {
            margin: 0;
            padding-left: 20px;
            list-style-type: disc;
        }

        .variable-list li {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
            cursor: pointer;
            transition: color 0.2s;
        }

        .variable-list li:hover {
            color: #2196F3;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .variable-lists {
                flex-direction: column;
            }
            
            .page-header {
                font-size: 36px;
            }
        }
    </style>
    
    <main id="ga-main">
        <div class="wrapper">
            <!-- Big Header -->
            <h1 class="page-header">Question Generation Page</h1>
            
            <div class="intro-section" style="margin-top:20px;">
                <div class="row">
                    <div class="col m3 s12">
                        <img class="responsive-img" src="/images/galileo/galileo-flask.png" style="width:90%;" />
                    </div>
                    <div class="col s12">
                        <!-- Variable Lists -->
                        <div class="variable-lists">
                            <div class="variable-list">
                                <h4>iMSMS Dataset Variables</h4>
                                <ul>
                                    <li onclick="setVariable1(this)">Age</li>
                                    <li onclick="setVariable1(this)">Disease</li>
                                    <li onclick="setVariable1(this)">Residence</li>
                                    <li onclick="setVariable1(this)">Smoking Status</li>
                                    <li onclick="setVariable1(this)">Sex</li>
                                </ul>
                            </div>
                            
                            <div class="variable-list">
                                <h4>Taxa Level Variables</h4>
                                <ul>
                                    <li onclick="setVariable2(this)">phylum</li>
                                    <li onclick="setVariable2(this)">class</li>
                                    <li onclick="setVariable2(this)">order</li>
                                    <li onclick="setVariable2(this)">family</li>
                                    <li onclick="setVariable2(this)">genus</li>
                                    <li onclick="setVariable2(this)">species</li>
                                </ul>
                            </div>
                        </div>

                        <!-- Input fields for two variables -->
                        <div class="input-field">
                            <input id="variable1" type="text" placeholder="Click an item above to select" readonly>
                            <label for="variable1"> Enter iMSMS variable </label>
                        </div>
                        
                        <div class="input-field">
                            <input id="variable2" type="text" placeholder="Click an item above to select" readonly>
                            <label for="variable2"> Enter Taxa level variable</label>
                        </div>
                        
                        <a href="#" id="seeViz" class="viz-link">Click to see viz for this question: "How does ___ and taxa level ___ affect microbial diversity in the iMSMS dataset?"</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        function updateVizLink() {
            const variable1 = document.getElementById('variable1').value.trim();
            const variable2 = document.getElementById('variable2').value.trim();
            const vizLink = document.getElementById('seeViz');
            
            // Only use defaults if both fields are completely empty
            const var1Text = variable1 || '___';
            const var2Text = variable2 || '___';
            
            vizLink.textContent = `Click to see viz for this question: "How does ${var1Text} affect microbial diversity in taxa level ${var2Text}?"`;
        }
        
        function setVariable1(element) {
            document.getElementById('variable1').value = element.textContent;
            updateVizLink();
        }
        
        function setVariable2(element) {
            document.getElementById('variable2').value = element.textContent;
            updateVizLink();
        }
        
        // Update the link text when inputs change
        document.getElementById('variable1').addEventListener('input', updateVizLink);
        document.getElementById('variable2').addEventListener('input', updateVizLink);
        
        // Initialize when page loads, but wait a moment for browser to restore form values
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(updateVizLink, 100);
        });
    </script>
</template>
